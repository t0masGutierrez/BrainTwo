<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BrainTwo</title>
    <link rel="icon" href="https://t0masgutierrez.github.io/BrainTwo/obsidian.png?v=2" type="image/png" sizes="512x512">
    <link rel="apple-touch-icon" href="https://t0masgutierrez.github.io/BrainTwo/obsidian.png?v=2">
    <meta property="og:image" content="https://t0masgutierrez.github.io/BrainTwo/obsidian.png?v=2">
    <meta property="og:image:secure_url" content="https://t0masgutierrez.github.io/BrainTwo/obsidian.png?v=2">
    <meta property="og:image:type" content="image/png">
    <meta property="og:image:width" content="512">
    <meta property="og:image:height" content="512">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:image" content="https://t0masgutierrez.github.io/BrainTwo/obsidian.png?v=2">
    <base href="/BrainTwo/">
    <script>
        // Direct note URLs must load assets from the site root.
        const base = document.querySelector('base');
        base.href = /^\/(BrainTwo|notes)(\/|$)/.test(location.pathname) ? '/BrainTwo/' : '/';
    </script>
    <link rel="stylesheet" href="site.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="mathjax-config.js"></script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>
</head>
<body>
    <div id="home" class="container">
        <h1></h1>
        <div class="search-container">
            <div id="search-command-box" class="search-command-box">
                <div id="search-highlight-layer" class="search-highlight-layer"></div>
                <input type="text" id="search-input" class="search-input" placeholder="Search BrainTwo" autocomplete="off" />
            </div>
            <div id="search-command-menu" class="search-command-menu"></div>
            <div id="search-results" class="search-results"></div>
        </div>
        <div id="folder-list" class="folder-list"></div>
    </div>
    <div id="folder-view" class="container" style="display: none;">
        <div style="display: flex; flex-direction: column; align-items: center; width: 100%;">
            <h1 id="folder-title" style="text-align: center; margin-bottom: 20px;"></h1>
            <button type="button" style="background: #fff; color: #222; border: 1px solid #222; border-radius: 0; font-size: 16px; padding: 5px 18px; font-weight: 400; margin-bottom: 20px; font-family: inherit; cursor: pointer; transition: background 0.2s, color 0.2s;" onclick="app.showHome()">Back</button>
            <div id="file-list" class="file-list"></div>
        </div>
    </div>
    <div id="file-view" class="container" style="display: none;">
        <h1 id="file-title" class="page-title" style="text-align: center; margin-bottom: 24px; margin-top: 40px;"></h1>
        <div class="options-bar" style="margin-bottom: 40px;">
            <button type="button" style="background: #fff; color: #222; border: 1px solid #222; border-radius: 0; font-size: 16px; padding: 5px 18px; font-weight: 400; font-family: inherit; cursor: pointer; transition: background 0.2s, color 0.2s;" onclick="app.showFolder(app.currentFolder)">Back</button>
            <button type="button" style="background: #fff; color: #222; border: 1px solid #222; border-radius: 0; font-size: 16px; padding: 5px 18px; font-weight: 400; font-family: inherit; cursor: pointer; transition: background 0.2s, color 0.2s;" onclick="app.showHome()">Home</button>
            <button type="button" id="learn-btn" style="background: #fff; color: #222; border: 1px solid #222; border-radius: 0; font-size: 16px; padding: 5px 18px; font-weight: 400; font-family: inherit; cursor: pointer; transition: background 0.2s, color 0.2s;" onclick="app.showLearnModal()">Learn</button>
        </div>
        <div id="file-content" class="content"></div>
    </div>
    <div id="choice-view" class="choice-view" style="display: none;">
        <h1 id="choice-title" class="learn-title page-title" style="text-align: center; margin-bottom: 24px; margin-top: 40px;"></h1>
        <div class="learn-progress-row" style="margin-bottom: 20px;">
            <button class="back-button learn-back-btn" onclick="app.goBackToLearnModal()">Back</button>
            <span id="choice-ratio" class="learn-ratio"></span>
            <div class="progress-bar learn-progress-bar">
                <div id="choice-progress-fill" class="progress-fill"></div>
            </div>
        </div>
        <div id="choice-question" class="choice-question"></div>
        <div id="choice-options" class="choice-options"></div>
    </div>
    <div id="write-view" class="choice-view" style="display: none;">
        <h1 id="write-title" class="learn-title page-title" style="text-align: center; margin-bottom: 24px; margin-top: 40px;"></h1>
        <div class="learn-progress-row" style="margin-bottom: 20px;">
            <button class="back-button learn-back-btn" onclick="app.goBackToLearnModal()">Back</button>
            <span id="write-ratio" class="learn-ratio"></span>
            <div class="progress-bar learn-progress-bar">
                <div id="write-progress-fill" class="progress-fill"></div>
            </div>
        </div>
        <div id="write-question" class="choice-question"></div>
        <div id="write-answer-box" style="width: 100%; max-width: 600px; margin: 0 auto 32px auto;">
            <input id="write-input-single" type="text" autocomplete="off" style="width: 100%; font-size: 1.2em; background: #23232b; color: #fff; border: 3px solid #555; border-radius: 0; padding: 18px 16px; outline: none; box-sizing: border-box; margin-bottom: 0;" onfocus="this.style.borderColor='#555'" onblur="this.style.borderColor='#555'" onkeydown="if(event.key==='Enter'){app.writeMode._submittedWithEnter=true;app.writeMode.submit();}" />
            <textarea id="write-input-multi" autocomplete="off" rows="3" style="display: none; width: 100%; font-size: 1.2em; background: #23232b; color: #fff; border: 3px solid #555; border-radius: 0; padding: 18px 16px; outline: none; box-sizing: border-box; margin-bottom: 0; resize: vertical; font-family: inherit;" onfocus="this.style.borderColor='#555'" onblur="this.style.borderColor='#555'" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();app.writeMode._submittedWithEnter=true;app.writeMode.submit();}"></textarea>
            <div id="write-feedback" style="margin-top: 18px;"></div>
            <div style="display: flex; justify-content: flex-end; align-items: center; gap: 16px; margin-top: 24px;">
                <button id="write-override-btn" type="button" class="back-button" style="display: none; color: #fff; background-color: #333; border: 1px solid #555; border-radius: 0; font-size: 1em; padding: 5px 18px; font-weight: 400;" onclick="app.writeMode.override()">I was correct</button>
                <button id="write-skip-btn" type="button" class="back-button" style="color: #fff; background-color: #333; border: 1px solid #555; border-radius: 0; font-size: 1em; padding: 5px 18px; margin-right: 8px; font-weight: 400;" onclick="app.writeMode.skip()">Don't know?</button>
                <button id="write-submit-btn" type="button" class="back-button" style="color: #fff; background-color: #333; border: 1px solid #555; border-radius: 0; font-size: 1em; padding: 5px 18px; font-weight: 500;" onclick="app.writeMode.submit()">Answer</button>
            </div>
        </div>
    </div>
    <div id="test-view" class="test-view" style="display: none;">
        <h1 id="test-title" class="learn-title page-title" style="text-align: center; margin-bottom: 24px; margin-top: 40px;"></h1>
        <div class="learn-progress-row" style="margin-bottom: 20px;">
            <button class="back-button learn-back-btn" onclick="app.goBackToLearnModal()">Back</button>
        </div>
        <div id="test-container" class="test-panel"></div>
    </div>
    <div id="flashcard-view" class="flashcard-view">
        <h1 id="flashcard-title" class="learn-title page-title" style="text-align: center; margin-bottom: 24px; margin-top: 40px;"></h1>
        <div class="learn-progress-row" style="margin-bottom: 20px;">
            <button class="back-button learn-back-btn" onclick="app.goBackToLearnModal()">Back</button>
            <span id="flashcard-ratio" class="learn-ratio"></span>
            <div class="progress-bar learn-progress-bar" id="flashcard-progress-bar">
                <div id="progress-fill" class="progress-fill"></div>
            </div>
        </div>
        <div id="flashcard" class="flashcard" onclick="app.flashcardMode.flip()"></div>
        <div class="nav-arrows">
            <div class="arrow" onclick="app.flashcardMode.prev()">&#8592;</div>
            <div class="arrow" onclick="app.flashcardMode.next()">&#8594;</div>
        </div>
    </div>
    <div id="session-summary-modal" class="modal">
        <div class="modal-content session-summary-content">
            <h2 style="margin-top: 0;">Summary</h2>
            <div class="summary-columns">
                <div class="summary-list" id="summary-correct-list"></div>
                <div class="summary-list" id="summary-retried-list"></div>
            </div>
            <div class="summary-actions">
                <button type="button" style="background: #fff; color: #222; border: 1px solid #222; border-radius: 0; font-size: 16px; padding: 5px 18px; font-weight: 400; font-family: inherit; cursor: pointer;" onclick="app.restartSummarySession()">Restart</button>
                <button id="summary-review-btn" type="button" style="background: #fff; color: #222; border: 1px solid #222; border-radius: 0; font-size: 16px; padding: 5px 18px; font-weight: 400; font-family: inherit; cursor: pointer;" onclick="app.reviewRetriedSummary()">Review retried</button>
                <button type="button" style="background: #fff; color: #222; border: 1px solid #222; border-radius: 0; font-size: 16px; padding: 5px 18px; font-weight: 400; font-family: inherit; cursor: pointer;" onclick="app.finishSummary()">Done</button>
            </div>
        </div>
    </div>
    <div id="learn-modal" class="modal">
        <div class="modal-content">
            <form id="learn-form">
                <div class="form-group">
                    <label for="type">Mode:</label>
                    <select id="type">
                        <option value="flashcards">Flash</option>
                        <option value="choice">Choose</option>
                        <option value="write">Write</option>
                        <option value="test">Test</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="answer">Answer:</label>
                    <select id="answer">
                        <option value="term" selected>Term</option>
                        <option value="definition">Definition</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="shuffle-toggle" style="margin: 0; min-width: 60px; display: block;">Shuffle:</label>
                    <div style="display: flex; align-items: center;">
                        <div id="shuffle-toggle" class="toggle-switch" onclick="app.toggleShuffle()">
                            <div class="toggle-slider"></div>
                        </div>
                        <span id="shuffle-toggle-label" style="margin-left: 12px; font-size: 15px;">Off</span>
                    </div>
                </div>
                <div class="form-group">
                    <label style="margin: 0; min-width: 60px; display: block;">Star:</label>
                    <div style="display: flex; align-items: center; height: 28px;">
                        <span id="star-toggle" class="card-star" style="position: static; font-size: 1.4em; cursor: pointer; line-height: 1; transform: none;" onclick="app.toggleStar()">☆</span>
                        <span id="star-empty-message" class="star-empty-message" aria-live="polite"></span>
                    </div>
                </div>
                <div style="display: flex; justify-content: space-between; margin-top: 16px;">
                    <button type="button" style="background: #fff; color: #222; border: 1px solid #222; border-radius: 0; font-size: 16px; padding: 5px 18px; font-weight: 400; font-family: inherit; cursor: pointer;" onclick="app.closeModal()">Close</button>
                    <button type="button" style="background: #fff; color: #222; border: 1px solid #222; border-radius: 0; font-size: 16px; padding: 5px 18px; font-weight: 400; font-family: inherit; cursor: pointer;" onclick="app.startLearning()">Start</button>
                </div>
            </form>
        </div>
    </div>
    <div id="image-focus-overlay" class="image-focus-overlay" role="dialog" aria-modal="true" aria-label="Focused image" tabindex="-1">
        <img id="image-focus-img" alt="">
    </div>

    <script src="site.js"></script>
    <button id="scroll-top-btn" style="position: fixed; bottom: 40px; right: 40px; z-index: 1000; display: none; background: #333; color: #fff; border: 1px solid #555; border-radius: 50%; width: 48px; height: 48px; font-size: 28px; cursor: pointer; align-items: center; justify-content: center;">
        &#8593;
    </button>
</body>
</html>
